description: >-
  The entity-relationship graph behind SimpleTexting's v2 API: an account (tenant)
  owns sending phone numbers; contacts belong to lists and are matched by segments;
  messages and campaigns move text and media to those contacts; webhooks report the
  events back.
notation: >-
  relationships use has_one / has_many / belongs_to with the foreign-key field name;
  direction is from the entity that owns the reference.
identifiers:
  format: 24-character hexadecimal string (MongoDB ObjectId shape)
  example: 507f191e810c19729de860ea
  alternates: >-
    Contacts may be addressed by phone number ({contactIdOrNumber}); contact lists by
    name ({listIdOrName}).
entities:
  - {name: Tenant, schema: TenantInfo, domain: account, description: The SimpleTexting account. Exposes the owner email via getTenantInfo.}
  - {name: TenantPhone, schema: TenantPhone, domain: account, description: A sending number provisioned on the account (number + name).}
  - {name: Contact, schema: Contact, domain: audience, description: A person reachable by phone, with names, email, birthday, comment, subscriptionStatus, custom fields and list membership.}
  - {name: ContactList, schema: List, domain: audience, description: A named, manually-managed group of contacts.}
  - {name: Segment, schema: Segment, domain: audience, description: A dynamic, rule-based grouping of contacts. Read-only over the API.}
  - {name: CustomField, schema: CustomField, domain: audience, description: An account-defined contact attribute with a merge tag and a default max length.}
  - {name: Message, schema: Message, domain: messaging, description: A single inbound or outbound SMS/EXTENDED_SMS/MMS, with directionType, category, timestamp and media.}
  - {name: Campaign, schema: FetchedCampaignDto, domain: messaging, description: A bulk send to lists and/or segments, built from a MessageTemplate and reporting an outcome.}
  - {name: MessageTemplate, schema: MessageTemplate, domain: messaging, description: The body of a campaign — mode, subject, text, fallbackText, media.}
  - {name: CampaignOutcome, schema: FetchedCampaignOutcomeDto, domain: messaging, description: Delivery counters for a campaign.}
  - {name: TrackingLink, schema: TrackingLink, domain: messaging, description: A shortened/tracked link inside a campaign message.}
  - {name: MediaItem, schema: StFileDto, domain: media, description: An uploaded MMS asset — name, size, contentType, gallery, status, link.}
  - {name: Webhook, schema: Webhook, domain: events, description: A subscription binding a URL to one or more event triggers, optionally filtered by account/contact phone.}
  - {name: BatchUpdateTask, schema: ContactsBatchUpdateResult, domain: audience, description: The asynchronous result of a batch contact update, polled by taskId.}
  - {name: BatchDeleteResult, schema: ContactsBatchDeleteResult, domain: audience, description: The per-contact result of a batch delete.}
