limit_count: 2
responseHeaders:
  observed: none
  probed: '2026-08-13'
  probe: GET https://api-app2.simpletexting.com/v2/api/messages (unauthenticated)
  detail: >-
    The response carried Server, Date, Content-Type, Connection,
    Strict-Transport-Security and CORS headers only. No RateLimit-*, no
    X-RateLimit-*, no Retry-After. An agent has no runtime signal to back off on.
responseCodes:
  throttled: not documented
  note: >-
    SimpleTexting's published OpenAPI declares no 429 response on any of its 38
    operations, and the reference does not name a throttling status code. A prior
    revision of this artifact asserted 429; that was an assumption and has been
    removed. Treat exhaustion behaviour as unknown until observed under load.
limits:
- name: Page size
  scope: endpoint
  metric: items per request
  limit: 500
  window: per request
  published: true
  notes: >-
    The only hard numeric limit SimpleTexting publishes for the API itself — the
    `size` query parameter on every list operation has maximum 500, default 50
    (OpenAPI parameter schema).
- name: Webhook delivery rate
  scope: webhook subscription
  metric: requests
  limit: 25
  window: per second
  published: true
  notes: >-
    `requestPerSecLimit` on a webhook subscription, maximum 25 (OpenAPI
    WebhookRequest schema). This caps how fast SimpleTexting calls YOUR endpoint;
    it is not a limit on your calls to SimpleTexting.
- name: API request rate
  scope: account
  metric: requests
  limit: not published
  published: false
  notes: >-
    No per-account or per-key request quota appears anywhere in the public
    reference, and no header exposes one at runtime.
- name: Message throughput (MPS)
  scope: sending number
  metric: messages
  limit: not published
  published: false
  notes: >-
    Outbound throughput is governed by sending number type (toll-free, 10DLC local,
    short code) and carrier registration status rather than by an API quota.
    SimpleTexting publishes no numeric MPS figure per number type.
policies:
- name: Number-Based Throughput
  description: Sending throughput depends on number type and 10DLC / toll-free registration status; registered campaigns receive higher throughput.
- name: Backoff Strategy
  description: >-
    Because no limit, status code or Retry-After header is published, clients should
    apply conservative exponential backoff with jitter on any non-2xx and must NOT
    blind-retry message or campaign sends — the API has no idempotency key, so a
    retry can bill a second send (conventions/simpletexting-conventions.yml).
